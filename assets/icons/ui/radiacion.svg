<!-- APRENDE: Icono radiacion. Este archivo dibuja una imagen con formas. Para usar otro icono en la página,
     cambia src de su img en HTML. Para probar otro color aquí, cambia stroke o fill; algunas reglas de
     estilos.css lo convierten en blanco. -->
<!-- APRENDE: Espacio de dibujo: viewBox="0 0 24 24" equivale a una hoja de 24 por 24 unidades. Conserva este
     marco para no recortar el símbolo. stroke elige el color de las líneas, stroke-width su grosor (prueba
     2.2 en lugar de 1.8). fill="none" deja el interior vacío; round suaviza extremos y esquinas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#6E2E94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- APRENDE: Círculo: cx mueve el centro a los lados, cy arriba o abajo y r cambia su tamaño. Aumenta r
       para agrandarlo dentro del marco de 24 por 24. -->
  <circle cx="12" cy="12" r="1.6"/>
  <!-- APRENDE: Trazo de una parte del icono. Usa el color y grosor elegidos en svg. d indica por dónde se
       dibuja: M mueve el lápiz, L dibuja una recta, H/V una línea horizontal/vertical, C una curva y A un
       arco; Z cierra la figura. Mayúsculas indican posiciones y minúsculas desplazamientos. Prueba cambiar
       una medida cada vez para observar la forma. -->
  <path d="M7.6 4.3a9 9 0 0 1 8.8 0L13.7 9a3.4 3.4 0 0 0-3.4 0Z"/>
  <!-- APRENDE: Trazo de una parte del icono. Usa el color y grosor elegidos en svg. d indica por dónde se
       dibuja: M mueve el lápiz, L dibuja una recta, H/V una línea horizontal/vertical, C una curva y A un
       arco; Z cierra la figura. Mayúsculas indican posiciones y minúsculas desplazamientos. Prueba cambiar
       una medida cada vez para observar la forma. -->
  <path d="M20.4 15.6a9 9 0 0 1-4.4 3.9l-2.7-4.7a3.4 3.4 0 0 0 1.7-2.9Z"/>
  <!-- APRENDE: Trazo de una parte del icono. Usa el color y grosor elegidos en svg. d indica por dónde se
       dibuja: M mueve el lápiz, L dibuja una recta, H/V una línea horizontal/vertical, C una curva y A un
       arco; Z cierra la figura. Mayúsculas indican posiciones y minúsculas desplazamientos. Prueba cambiar
       una medida cada vez para observar la forma. -->
  <path d="M8 19.5a9 9 0 0 1-4.4-3.9l5.4-.1a3.4 3.4 0 0 0 1.7 2.9Z"/></svg>
