<!-- Este dibujo esta guardado en el proyecto y no necesita descargar iconos de internet. -->
<!-- Empieza el dibujo del icono; puede agrandarse conservando su forma. -->
<!-- xmlns indica que este archivo es un dibujo que el navegador puede mostrar. -->
<!-- viewBox define el espacio del dibujo que se ajusta al tamaño del icono. -->
<!-- role indica si esta parte debe anunciarse como una imagen, un menú o un botón. -->
<!-- aria-labelledby usa el título indicado como nombre de esta sección. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
<!-- Elige el texto que aparece en la pestaña del navegador. -->
<!-- id le da el nombre title; sirve para encontrarla o abrirla desde un enlace. -->
<title id="title">Facebook</title>
<!-- Dibuja un rectángulo con el tamaño, las esquinas y el color indicados. -->
<!-- width fija el ancho inicial; aumentar el número lo hace más grande. -->
<!-- height fija el alto inicial; aumentar el número lo hace más grande. -->
<!-- rx redondea las esquinas del rectángulo. -->
<!-- fill elige el color interior; none deja el interior vacío. -->
<rect width="32" height="32" rx="4" fill="#48B7BD"/>
<!-- Dibuja la figura del icono siguiendo el recorrido guardado en d. -->
<!-- fill elige el color interior; none deja el interior vacío. -->
<!-- d guarda el recorrido del símbolo; cambiar esos números cambia su figura. -->
<path fill="#fff" d="M18.2 27V17.2h3.3l.5-3.8h-3.8V11c0-1.1.3-1.9 1.9-1.9h2V5.7c-.4 0-1.6-.2-2.9-.2-2.9 0-4.9 1.8-4.9 5v2.8H11v3.8h3.3V27h3.9z"/>
<!-- Termina el dibujo del icono. -->
</svg>
